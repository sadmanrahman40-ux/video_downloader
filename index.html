<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Saver</title>
<style>
  :root{--bg:#eef2f5;--ink:#14202b;--muted:#5b6b7a;--line:#c9d3dc;--accent:#2457f5;--panel:#fff;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e8eef3;--muted:#93a3b2;--line:#2a3743;--accent:#6d93ff;--panel:#17212a;--err:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif;min-height:100vh;display:grid;place-items:start center;padding:8vh 20px}
  main{width:100%;max-width:640px}
  h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:0 0 .5rem;letter-spacing:-.02em}
  p.lead{margin:0 0 2rem;color:var(--muted)}
  form{display:flex;gap:8px}
  input{flex:1;min-width:0;padding:14px 16px;font:inherit;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px}
  input:focus,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button,select{font:600 16px system-ui,sans-serif;padding:14px 20px;border-radius:6px;border:0;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  select{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);font-weight:500}
  #msg{margin:1rem 0 0;font-family:system-ui,sans-serif;font-size:15px;min-height:1.4em}
  #msg.err{color:var(--err)}
  #result{display:none;margin-top:1.5rem;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
  #result img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:var(--line)}
  .body{padding:16px;display:grid;gap:12px}
  .body h2{margin:0;font-size:1.15rem;line-height:1.3}
  .meta{margin:0;color:var(--muted);font:14px system-ui,sans-serif}
  .row{display:flex;gap:8px}
  .row select{flex:0 0 auto}.row button{flex:1}
  details{margin-top:2rem;font:14px system-ui,sans-serif;color:var(--muted)}
  details input{margin-top:8px;width:100%;font-size:14px;padding:10px 12px}
  footer{margin-top:2.5rem;color:var(--muted);font:13px/1.5 system-ui,sans-serif}
  @media (max-width:520px){form{flex-direction:column}}
</style>
</head>
<body>
<main>
  <h1>Save a video to your device</h1>
  <p class="lead">Paste a YouTube or Facebook link, pick a quality, and download.</p>
  <form id="f">
    <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." aria-label="Video link" autocomplete="off">
    <button id="go">Find video</button>
  </form>
  <p id="msg" role="status"></p>
  <section id="result">
    <img id="thumb" alt="">
    <div class="body">
      <h2 id="title"></h2>
      <p class="meta" id="meta"></p>
      <div class="row">
        <select id="quality" aria-label="Quality"></select>
        <button id="dl" type="button">Download</button>
      </div>
    </div>
  </section>
  <details id="cfg"><summary>Server address</summary>
    <input id="api" type="url" placeholder="Leave blank if this page is served by the app" aria-label="Server address">
  </details>
  <footer>Only download videos you own, have permission to use, or that are licensed for reuse. Downloading may breach a platform's terms of service.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const label = q => q === "audio" ? "Audio only (m4a)" : q + "p video";
const fmt = s => s ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "";
let current = "";
const base = () => ($("api").value.trim() || "").replace(/\/$/, "");
try { $("api").value = localStorage.getItem("vs_api") || ""; } catch(e) {}
$("api").addEventListener("change", () => { try { localStorage.setItem("vs_api", $("api").value.trim()); } catch(e) {} });

function say(text, err){ $("msg").textContent = text; $("msg").className = err ? "err" : ""; }

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  current = $("url").value.trim();
  $("result").style.display = "none";
  $("go").disabled = true; say("Looking up the video…");
  try {
    const r = await fetch(base() + "/api/info", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url:current})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Something went wrong.");
    $("thumb").src = d.thumbnail || ""; $("title").textContent = d.title;
    $("meta").textContent = [d.uploader, fmt(d.duration)].filter(Boolean).join(", ");
    $("quality").innerHTML = [...d.qualities, "audio"].map(q => `<option value="${q}">${label(q)}</option>`).join("");
    $("result").style.display = "block"; say("");
  } catch (err) { say(err.message === "Failed to fetch" ? "Can't reach the server. Check the server address below and that the app is running." : err.message, true); }
  $("go").disabled = false;
});

$("dl").addEventListener("click", () => {
  say("Preparing your file. This can take a minute for long videos.");
  const a = document.createElement("a");
  a.href = base() + "/api/download?url=" + encodeURIComponent(current) + "&quality=" + $("quality").value;
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
